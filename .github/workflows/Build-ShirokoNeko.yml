name: 编译-黑厂MT6873-安卓12ShirokoNeko内核
            支持ksu docker lxc

on:
  push:
  workflow_dispatch:
  #schedule:
    #- cron: '0 0 * * 5' # Run every friday at midnight
    
jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4



    - name: 下载环境依赖
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 python2 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace



    - name: 下载 Gcc编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        
        mkdir gcc64
        wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc64/ -zxvf gcc-aarch64.tar.gz
    
        mkdir gcc32
        wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc32/ -zxvf gcc-arm.tar.gz
    
    - name: 下载Clang编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp
    
    
    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/Winkmoon/android_kernel_mtk6873_ShirokoNeko xinran
        cd xinran



    - name: 集成SukiSU并添加内核配置选项
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/xinran
        rm -rf KernelSU
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki
        cd ./KernelSU
        KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 10700)
        export KSU_VERSION=$KSU_VERSION
        sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=$KSU_VERSION/" kernel/Makefile
        cd ..

        echo "CONFIG_MODULE_SIG=n" >> ./arch/arm64/configs/mt6873_defconfig
        echo "CONFIG_MODULE_SIG_ALL=n" >> ./arch/arm64/configs/mt6873_defconfig

        
        echo "CONFIG_KSU=y" >> ./arch/arm64/configs/mt6873_defconfig
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./arch/arm64/configs/mt6873_defconfig
        echo "CONFIG_KSU_TRACEPOINT_HOOK=y" >> ./arch/arm64/configs/mt6873_defconfig


        echo "CONFIG_KPM=y" >> ./arch/arm64/configs/mt6873_defconfig
        echo "CONFIG_KPROBES=y" >> ./arch/arm64/configs/mt6873_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> ./arch/arm64/configs/mt6873_defconfig


        echo "CONFIG_KALLSYMS=y" >> ./arch/arm64/configs/mt6873_defconfig
        echo "CONFIG_KALLSYMS_ALL=y" >> ./arch/arm64/configs/mt6873_defconfig


        echo "CONFIG_OVERLAY_FS=y" >> ./arch/arm64/configs/mt6873_defconfig
               
    - name: 设置ccache缓存
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-mido-kernel
        max-size: 2G

 
    - name: 添加ShirokoNeko签名并编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/xinran
        sed -i "\$s|echo \"\\\$res\"|echo \"-Xinran_StarBai_mt6783-SukiSU\"|" ./scripts/setlocalversion
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export KBUILD_BUILD_USER=Ran love Bai
        export KBUILD_BUILD_HOST=Ran_yong_yuan_ai_bai
        export KBUILD_BUILD_TIMESTAMP="Mon Sep 22 22:53:44 UTC 2025"
        export KBUILD_BUILD_HOST=ShirokoNeko_Xinran_StarBai
        export KBUILD_BUILD_USER=Xinran_Starbai
        make -s -j$(nproc --all) O=out ARCH=arm64 mtk6873_defconfig
        make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld
                

    - name: 制作Anykernel3卡刷包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/Winkmoon/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp xinran/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        
    
    
    - name: 上传 Anykernel3
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_MT6873-Android12-kernel
        path: kernel_workspace/AnyKernel3/*
        

    - name: 上传编译内核
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_MT6873-Android12-kernel-Image.gz-dtb
        path: kernel_workspace/xinran/out/arch/arm64/boot/Image.gz-dtb
